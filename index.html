<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    h1, h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 5px;
      border: none;
    }
    input {
      background-color: #1e1e1e;
      color: #fff;
    }
    button {
      background-color: #6200ea;
      color: #fff;
      cursor: pointer;
    }
    .entry {
      background-color: #1f1f1f;
      margin: 0.5rem 0;
      padding: 0.5rem;
      border-radius: 5px;
    }
    .hidden {
      display: none;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-dcq2u92SEHG7X2EOKsLRYYqQs0Wo4XY",
      authDomain: "finance-tracker-222b1.firebaseapp.com",
      projectId: "finance-tracker-222b1",
      storageBucket: "finance-tracker-222b1.firebasestorage.app",
      messagingSenderId: "893840700065",
      appId: "1:893840700065:web:80ee5e8d82e383c09336e0",
      measurementId: "G-7J1JMQ2L8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginForm = document.getElementById("loginForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const trackerSection = document.getElementById("trackerSection");
    const financeForm = document.getElementById("financeForm");
    const dataList = document.getElementById("dataList");

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = loginForm.email.value;
      const password = loginForm.password.value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        if (err.code === 'auth/user-not-found') {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          alert(err.message);
        }
      }
    };

    logoutBtn.onclick = () => signOut(auth);

    financeForm.onsubmit = async (e) => {
      e.preventDefault();
      const type = financeForm.type.value;
      const description = financeForm.description.value;
      const amount = parseFloat(financeForm.amount.value);
      const userId = auth.currentUser.uid;

      await addDoc(collection(db, "finances"), {
        userId,
        type,
        description,
        amount,
        timestamp: new Date()
      });

      financeForm.reset();
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        loginForm.classList.add("hidden");
        trackerSection.classList.remove("hidden");

        const q = query(collection(db, "finances"), where("userId", "==", user.uid));
        onSnapshot(q, snapshot => {
          dataList.innerHTML = "";
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const div = document.createElement("div");
            div.className = "entry";
            div.innerHTML = `
              <strong>${data.type.toUpperCase()}</strong>: ${data.description} - ₹${data.amount}
              <button onclick="deleteDocEntry('${docSnap.id}')">Delete</button>
            `;
            dataList.appendChild(div);
          });
        });
      } else {
        loginForm.classList.remove("hidden");
        trackerSection.classList.add("hidden");
      }
    });

    window.deleteDocEntry = async function (id) {
      await deleteDoc(doc(db, "finances", id));
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>Finance Tracker</h1>

    <form id="loginForm">
      <h2>Login / Signup</h2>
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login or Signup</button>
    </form>

    <div id="trackerSection" class="hidden">
      <h2>Your Transactions</h2>
      <form id="financeForm">
        <select name="type">
          <option value="expense">Expense</option>
          <option value="lend">Lent</option>
          <option value="owe">Owed</option>
        </select>
        <input type="text" name="description" placeholder="Description" required />
        <input type="number" name="amount" placeholder="Amount" required />
        <button type="submit">Add</button>
      </form>
      <button id="logoutBtn">Logout</button>
      <div id="dataList"></div>
    </div>
  </div>
</body>
</html>
