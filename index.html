
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #1e1e1e;
      border-radius: 10px;
    }
    h1, h2 {
      text-align: center;
      color: #00ff99;
    }
    label, input, select, button, textarea {
      display: block;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }
    input, select, textarea {
      padding: 8px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #f0f0f0;
      border-radius: 5px;
    }
    button {
      background-color: #00ff99;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #444;
      text-align: center;
    }
    .login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #121212;
    }
  </style>
</head>
<body>
  <div class="login-screen" id="login-screen">
    <div class="container">
      <h2>Login to Finance Tracker</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
      <p id="login-error" style="color:red;"></p>
    </div>
  </div>
  <div class="container" id="app" style="display:none">
    <h1>Finance Tracker</h1>

    <h2>Monthly Budget: ₹<span id="monthlyBudget">10000</span></h2>
    <p>Total Spent: ₹<span id="totalSpent">0</span></p>
    <p>Balance: ₹<span id="balance">10000</span></p>

    <h2>Add Expense</h2>
    <input id="expenseName" placeholder="Expense Name" />
    <input id="expenseAmount" type="number" placeholder="Amount" />
    <select id="expenseCategory">
      <option>Food</option>
      <option>Travel</option>
      <option>Study</option>
      <option>Shopping</option>
      <option>Other</option>
    </select>
    <button onclick="addExpense()">Add Expense</button>

    <h2>Expenses</h2>
    <table id="expenseTable">
      <tr><th>Name</th><th>Amount</th><th>Category</th></tr>
    </table>

    <h2>Lend/Borrow Tracker</h2>
    <input id="personName" placeholder="Person's Name" />
    <input id="moneyAmount" type="number" placeholder="Amount" />
    <select id="moneyStatus">
      <option>Borrowed</option>
      <option>Lent</option>
    </select>
    <input id="dueDate" type="date" />
    <button onclick="addRecord()">Add Record</button>

    <table id="lendTable">
      <tr><th>Name</th><th>Amount</th><th>Status</th><th>Due</th></tr>
    </table>
  </div>

  <script>
    const validUsername = "user";
    const validPassword = "pass";

    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      if (username === validUsername && password === validPassword) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "block";
      } else {
        document.getElementById("login-error").innerText = "Invalid credentials!";
      }
    }

    let totalSpent = 0;
    const budget = 10000;

    function updateSummary() {
      document.getElementById("totalSpent").innerText = totalSpent;
      document.getElementById("balance").innerText = budget - totalSpent;
    }

    function addExpense() {
      const name = document.getElementById("expenseName").value;
      const amount = parseInt(document.getElementById("expenseAmount").value);
      const category = document.getElementById("expenseCategory").value;

      if (!name || !amount) return alert("Fill all fields");
      totalSpent += amount;
      updateSummary();

      const row = `<tr><td>${name}</td><td>₹${amount}</td><td>${category}</td></tr>`;
      document.getElementById("expenseTable").innerHTML += row;
    }

    function addRecord() {
      const person = document.getElementById("personName").value;
      const amount = document.getElementById("moneyAmount").value;
      const status = document.getElementById("moneyStatus").value;
      const due = document.getElementById("dueDate").value;

      if (!person || !amount || !due) return alert("Fill all fields");
      const row = `<tr><td>${person}</td><td>₹${amount}</td><td>${status}</td><td>${due}</td></tr>`;
      document.getElementById("lendTable").innerHTML += row;
    }
  </script>
</body>
</html>
